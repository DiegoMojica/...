<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un regalo para ti</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Playfair+Display:wght@600;700&display=swap");

    :root {
      --bg1: #fff0c2;
      --bg2: #ffd06b;
      --bg3: #f08d00;
      --ink: #4e2800;
      --card: rgba(255, 248, 228, 0.9);
      --accent: #b05300;
      --stem: #3f9547;
      --stem-dark: #2f7a38;
      --petal1: #ffe885;
      --petal2: #ffd44d;
      --center: #8f4500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% 8%, rgba(255, 246, 210, 0.95), transparent 70%),
        radial-gradient(700px 420px at 88% 12%, rgba(255, 223, 144, 0.82), transparent 70%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 45%, var(--bg3));
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 18px;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 244, 188, 0.95), rgba(255, 244, 188, 0));
      filter: blur(2px);
      pointer-events: none;
      animation: floatGlow 8s ease-in-out infinite;
    }

    .g1 {
      top: -70px;
      right: -80px;
    }

    .g2 {
      width: 240px;
      height: 240px;
      left: -60px;
      bottom: 10%;
      animation-delay: -3s;
    }

    .wrap {
      width: min(1080px, 97vw);
      height: min(860px, 95dvh);
      position: relative;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .intro {
      width: min(760px, 96vw);
      padding: clamp(24px, 4vw, 44px);
      border-radius: 30px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 207, 114, 0.65);
      box-shadow: 0 24px 54px rgba(79, 42, 0, 0.22);
      transition: opacity 620ms ease, transform 620ms ease;
      backdrop-filter: blur(8px);
    }

    .intro.hide {
      opacity: 0;
      transform: translateY(-12px) scale(0.97);
      pointer-events: none;
    }

    .intro h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 1.02;
      color: #6b3600;
      margin-bottom: 12px;
      text-wrap: balance;
    }

    .intro p {
      font-size: clamp(1rem, 2.3vw, 1.2rem);
      color: #7c4a10;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 13px 28px;
      font-size: clamp(0.95rem, 2.2vw, 1.08rem);
      font-weight: 800;
      color: #fff8e8;
      cursor: pointer;
      background: linear-gradient(120deg, #d87800, #a54a00);
      box-shadow: 0 10px 20px rgba(96, 43, 0, 0.3);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 22px rgba(96, 43, 0, 0.36);
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.986);
      transition: opacity 760ms ease, transform 760ms ease;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(170deg, rgba(255, 251, 236, 0.95), rgba(255, 236, 178, 0.84));
      border: 1px solid rgba(255, 203, 108, 0.65);
      box-shadow: 0 28px 60px rgba(80, 42, 0, 0.25);
    }

    .copy {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 3;
      border-radius: 22px;
      text-align: center;
      padding: 16px 18px;
      background: rgba(255, 250, 235, 0.84);
      border: 1px solid rgba(255, 205, 114, 0.72);
      box-shadow: 0 8px 20px rgba(86, 48, 4, 0.11);
      backdrop-filter: blur(7px);
    }

    .copy h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.4rem, 3.6vw, 2.4rem);
      color: #6f3a02;
      margin-bottom: 6px;
    }

    .phrase {
      min-height: 38px;
      font-size: clamp(0.98rem, 2vw, 1.16rem);
      color: #7a4a14;
      font-weight: 700;
      line-height: 1.45;
      text-wrap: balance;
    }

    .art {
      position: absolute;
      inset: 0;
      padding-top: clamp(140px, 22vh, 210px);
    }

    #bouquet {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 20px rgba(77, 37, 0, 0.2));
    }

    .stem {
      stroke-dasharray: 1100;
      stroke-dashoffset: 1100;
      animation: draw 1.1s ease forwards;
      animation-delay: var(--d);
    }

    .leaf {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: leafIn 0.6s ease forwards;
      animation-delay: calc(var(--d) + 260ms);
    }

    .flower {
      opacity: 0;
      animation: flowerShow 0.12s linear forwards;
      animation-delay: calc(var(--d) + 380ms);
    }

    .flower-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: bloom 0.7s cubic-bezier(0.15, 0.9, 0.2, 1) forwards;
      animation-delay: calc(var(--d) + 380ms);
    }

    .petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .petal {
      position: absolute;
      width: 10px;
      height: 16px;
      border-radius: 62% 58% 60% 56%;
      background: linear-gradient(150deg, #ffe996, #ffc62b);
      box-shadow: inset -2px -2px 2px rgba(156, 85, 0, 0.2);
      animation: fall linear forwards;
    }

    .note {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.88rem;
      color: rgba(95, 55, 10, 0.84);
      z-index: 6;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes bloom {
      0% { opacity: 0; transform: scale(0.18); }
      75% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes flowerShow {
      to { opacity: 1; }
    }

    @keyframes leafIn {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 0.9; transform: scale(1); }
    }

    @keyframes fall {
      0% { transform: translate3d(0, -12px, 0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate3d(var(--dx), 106vh, 0) rotate(var(--rot)); opacity: 0; }
    }

    @keyframes floatGlow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .wrap {
        width: calc(100vw - 16px);
        height: 100dvh;
        min-height: 100dvh;
      }

      .intro,
      .card {
        border-radius: 24px;
      }

      .intro {
        width: 100%;
        max-width: 420px;
        padding: 22px 16px 24px;
      }

      .intro h1 {
        font-size: clamp(1.9rem, 9vw, 2.6rem);
      }

      .intro p {
        font-size: clamp(1.02rem, 4.8vw, 1.14rem);
      }

      .btn {
        min-width: 170px;
      }

      .copy {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 14px 14px;
      }

      .art {
        padding-top: clamp(122px, 20vh, 162px);
      }

      .note {
        bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>

  <main class="wrap">
    <section class="intro" id="intro">
      <h1>Te tengo un regalo para ti</h1>
      <p>Perdón por no poder estar en persona. Toca el botón y vas a ver magia.</p>
      <button class="btn" id="open">Abrir regalo</button>
    </section>

    <section class="scene" id="scene" aria-live="polite">
      <article class="card">
        <header class="copy">
          <h2>Para ti, mujer hermosa</h2>
          <p class="phrase" id="phrase"></p>
        </header>

        <div class="art">
          <svg id="bouquet" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="petals" id="petals"></div>
        </div>

        <p class="note">Con todo mi cariño mi negrita boff.</p>
      </article>
    </section>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const scene = document.getElementById("scene");
    const openBtn = document.getElementById("open");
    const phrase = document.getElementById("phrase");
    const svg = document.getElementById("bouquet");
    const petals = document.getElementById("petals");

    const finalPhrase = "Te regalo este ramo infinito porque te quiero mucho, eres muy linda.";

    const flowers = [
      [600, 235], [550, 255], [650, 255], [500, 285], [700, 285],
      [455, 330], [745, 330], [410, 375], [790, 375], [365, 420],
      [835, 420], [525, 355], [675, 355], [560, 410], [640, 410],
      [480, 450], [720, 450], [430, 500], [770, 500], [580, 485],
      [620, 485], [520, 540], [680, 540], [455, 575], [745, 575],
      [390, 610], [810, 610], [600, 605], [540, 635], [660, 635]
    ];

    function create(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    function drawDefs() {
      const defs = create("defs");

      const paperGrad = create("linearGradient", { id: "paperGrad", x1: "0%", y1: "0%", x2: "0%", y2: "100%" });
      paperGrad.appendChild(create("stop", { offset: "0%", "stop-color": "#ffd58f" }));
      paperGrad.appendChild(create("stop", { offset: "100%", "stop-color": "#ee9d49" }));

      const floor = create("radialGradient", { id: "floorGlow", cx: "50%", cy: "50%", r: "50%" });
      floor.appendChild(create("stop", { offset: "0%", "stop-color": "rgba(248, 201, 103, 0.52)" }));
      floor.appendChild(create("stop", { offset: "100%", "stop-color": "rgba(248, 201, 103, 0)" }));

      defs.appendChild(paperGrad);
      defs.appendChild(floor);
      svg.appendChild(defs);
    }

    function drawFlower(x, y, d) {
      const g = create("g", {
        class: "flower",
        style: `--d:${d}ms`,
        transform: `translate(${x} ${y})`
      });
      const core = create("g", { class: "flower-core", style: `--d:${d}ms` });

      for (let i = 0; i < 12; i++) {
        const angle = i * 30;
        const petal = create("ellipse", {
          cx: "0",
          cy: "-14",
          rx: "5.8",
          ry: "15.2",
          fill: i % 2 === 0 ? "#ffe885" : "#ffd44d",
          transform: `rotate(${angle})`
        });
        core.appendChild(petal);
      }

      core.appendChild(create("circle", { cx: "0", cy: "0", r: "7.2", fill: "#8f4500" }));
      core.appendChild(create("circle", { cx: "0", cy: "0", r: "5", fill: "#a65a00" }));
      g.appendChild(core);
      svg.appendChild(g);
    }

    function drawStem(x, y, index, d) {
      const baseX = 600;
      const baseY = 790;
      const c1x = 600 + (x - 600) * 0.36;
      const c1y = y + (baseY - y) * 0.56 - 95;

      const stem = create("path", {
        class: "stem",
        style: `--d:${d}ms`,
        d: `M ${baseX} ${baseY} Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${x} ${y}`,
        fill: "none",
        stroke: index % 2 === 0 ? "#3f9547" : "#2f7a38",
        "stroke-width": index < 10 ? "4.8" : "3.8",
        "stroke-linecap": "round"
      });
      svg.appendChild(stem);

      if (index % 2 === 0) {
        const lx = baseX + (x - baseX) * 0.58;
        const ly = baseY + (y - baseY) * 0.58;
        const leaf = create("ellipse", {
          class: "leaf",
          style: `--d:${d}ms`,
          cx: lx.toFixed(1),
          cy: ly.toFixed(1),
          rx: "9",
          ry: "19",
          fill: index % 4 === 0 ? "#49a450" : "#3d9147",
          transform: `rotate(${(index % 3 === 0 ? -55 : 55)} ${lx.toFixed(1)} ${ly.toFixed(1)})`
        });
        svg.appendChild(leaf);
      }
    }

    function drawWrapper() {
      svg.appendChild(create("ellipse", {
        cx: "600",
        cy: "820",
        rx: "250",
        ry: "54",
        fill: "url(#floorGlow)"
      }));

      svg.appendChild(create("path", {
        d: "M 520 700 Q 600 650 680 700 L 640 830 Q 600 865 560 830 Z",
        fill: "url(#paperGrad)",
        opacity: "0.95"
      }));

      svg.appendChild(create("path", {
        d: "M 600 718 Q 536 735 520 790 Q 560 792 590 748 Z",
        fill: "#f39b42",
        opacity: "0.95"
      }));

      svg.appendChild(create("path", {
        d: "M 600 718 Q 664 735 680 790 Q 640 792 610 748 Z",
        fill: "#ef8a28",
        opacity: "0.95"
      }));

      svg.appendChild(create("circle", { cx: "600", cy: "747", r: "13", fill: "#da6a0a" }));
    }

    function buildBouquet() {
      svg.innerHTML = "";
      drawDefs();

      flowers.forEach((f, i) => {
        const [x, y] = f;
        const d = i * 58;
        drawStem(x, y, i, d);
      });

      flowers.forEach((f, i) => {
        const [x, y] = f;
        const d = i * 58;
        drawFlower(x, y, d);
      });

      drawWrapper();
    }

    function applyResponsiveLayout() {
      if (window.innerWidth <= 760) {
        svg.setAttribute("viewBox", "330 210 540 700");
      } else {
        svg.setAttribute("viewBox", "0 0 1200 900");
      }
    }

    function addPetals() {
      petals.innerHTML = "";
      const total = 28;
      for (let i = 0; i < total; i++) {
        const p = document.createElement("span");
        p.className = "petal";
        p.style.left = `${(i * 3.4) % 100}%`;
        p.style.top = `${(i % 6) * -2}%`;
        p.style.animationDuration = `${5.8 + (i % 7) * 0.42}s`;
        p.style.animationDelay = `${(i % 9) * 0.24}s`;
        p.style.setProperty("--dx", `${(i % 2 === 0 ? 1 : -1) * (32 + (i % 5) * 22)}px`);
        p.style.setProperty("--rot", `${210 + i * 13}deg`);
        petals.appendChild(p);
      }
    }

    async function typePhrase(text) {
      phrase.textContent = "";
      for (let i = 0; i < text.length; i++) {
        phrase.textContent += text[i];
        await new Promise((resolve) => setTimeout(resolve, 22));
      }
    }

    openBtn.addEventListener("click", async () => {
      intro.classList.add("hide");
      setTimeout(() => scene.classList.add("active"), 220);
      applyResponsiveLayout();
      buildBouquet();
      addPetals();
      await typePhrase(finalPhrase);
    }, { once: true });

    applyResponsiveLayout();
    window.addEventListener("resize", applyResponsiveLayout);
  </script>
</body>
</html>
